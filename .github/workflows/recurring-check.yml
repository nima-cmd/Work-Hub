name: Recurring task check

# Hits the deployed app's internal recurring-check endpoint every 10 minutes —
# well under Render free web services' 15-min spin-down window, so this both
# keeps the app warm AND fires the 9am/2pm Airtable reminder + daily
# CSV-freshness check on schedule. See render.yaml for the full rationale.
#
# Note: GitHub Actions scheduled workflows are best-effort, not to-the-minute
# — GitHub can delay a scheduled run (sometimes by many minutes) during high
# platform load. Fine for a personal reminder; not a hard real-time guarantee.
#
# MEASURED REALITY (2026-07-31): this asks for */10 and actually fires roughly
# every 90 MINUTES. Observed gaps over 24h: 1h00m, 1h14m, 1h23m, 1h25m, 1h32m,
# 1h35m, 1h37m, 1h38m, 2h02m, 2h10m. Tightening the cron expression does not
# help — GitHub throttles regardless. Two consequences worth knowing:
#   • Mid-pack the routing feed can be ~90 min behind. That's what the "Pull
#     from NetSuite" button on the Routing view is for.
#   • Don't set a staleness alarm at the requested cadence; see
#     src/model/syncHealth.js, which warns at 3h and alarms at 6h.
#
# A green run here does NOT mean the syncs inside it did anything: the endpoint
# gates each one on its creds being present and returns 200 either way. Check
# GET /api/sync-health for what actually completed.
#
# Setup (one-time, in this repo's GitHub settings — Settings → Secrets and
# variables → Actions):
#   RENDER_URL   e.g. https://work-hub.onrender.com (no trailing slash)
#   CRON_SECRET  the exact same value you set on the Render service

# ⚠️ HOURLY, and asking for */10 is what nearly killed the database (2026-08-17).
#
# MEASURED, after Neon hit 100% of its 5 GB monthly transfer on a weekend Nima never
# touched the app:
#
#   54 runs in 24h (GitHub delivered ~every 27 min, not the ~90 assumed here)
#   ~4,450 queries and ~4.6 MB of Neon transfer PER RUN
#   = 249 MB/day = ~7.7 GB/month, against a 5 GB cap
#
# The deploy alone was 240,531 queries on 08-15 and 230,238 on 08-16 — days with no
# human activity at all. The old note below reasoned that asking for */10 was harmless
# because GitHub throttles it; that was true about the SCHEDULE and wrong about the
# COST, because nobody had multiplied a run by its price.
#
# ⚠️ Do not "optimise" this back down to */10 without re-measuring what a run costs.
# One hour is a deliberate budget: 24 runs x 4.6 MB = ~110 MB/day = ~3.4 GB/month, which
# fits with room for development on top. `npm run check:transfer` is how to check.
on:
  schedule:
    - cron: '0 * * * *'
  workflow_dispatch: {} # lets you manually trigger a run from the Actions tab, for testing

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger recurring-check endpoint
        run: |
          curl -sf -X POST "${{ secrets.RENDER_URL }}/api/internal/recurring-check" \
            -H "x-cron-secret: ${{ secrets.CRON_SECRET }}"
